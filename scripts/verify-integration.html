<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ThinkLab 瀏覽器整合測試</title>
  <style>
    body { margin:24px auto; padding:0 20px; max-width:1400px; font:16px/1.6 system-ui,sans-serif; background:#171923; color:#edf0fa; }
    button { font:inherit; padding:10px 20px; cursor:pointer; }
    code { color:#b4dcff; } li { margin:10px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .pass { color:#8be9a4; } .fail { color:#ffa0a0; } .running { color:#f5d784; }
    #summary { font-weight:bold; } iframe { width:100%; height:850px; margin:20px 0; border:1px solid #666; background:white; }
  </style>
</head>
<body>
  <h1>ThinkLab 瀏覽器整合測試</h1>
  <p>在專案目錄執行 <code>python3 -m http.server 8081 --bind 127.0.0.1</code>，開啟 <code>http://127.0.0.1:8081/scripts/verify-integration.html</code>。請使用測試專用的 8081 連接埠，執行期間保持此頁開啟。</p>
  <p>按下按鈕後才會載入真正的 Judge、LV.1 講義、Blockly 和 Pyodide。第一次下載 Python 環境可能需要數分鐘；測試只匯入本倉庫預先製作的積木檔。測試結束後會還原本次觸及的草稿與進度。</p>
  <button id="run" type="button">Run tests</button>
  <p id="summary" role="status" aria-live="polite">尚未執行</p>
  <ol id="results" aria-live="polite"></ol>
  <div id="pages"></div>
  <script src="verify-integration.js"></script>
</body>
</html>
