<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0d12">
  <meta name="description" content="ThinkLab 題庫：214 題循序練習，支援 Scratch、Blockly 與 Python，寫完立刻自動驗資。">
  <title>題庫｜ThinkLab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M8 17l5 5 11-13' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <link rel="stylesheet" href="assets/programming-editor.css">
  <script src="assets/programming-editor.js"></script>
  <script src="assets/problem-classification.js"></script>

  <style>
    :root {
      color-scheme: dark;
      /* 全站共用色票（與 algoplay/core/base.css、test/flow-lab.css 同一組值） */
      --bg: #0c0d12;
      --surface: #141720;
      --surface2: #1a1e28;
      --surface-dark: #10131b;
      --border: #262a33;
      --border-strong: #343d50;
      --accent: #3b82f6;
      --accent-hover: #4b7de7;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --accent-ink: #9ec5ff;
      --on-accent: #ffffff;
      --success: #63d6ad;
      --warning: #f1bd62;
      --danger: #ff8192;
      --info: #6dd5ed;
      --text: #f5f7fa;
      --text-muted: #94a3b8;
      --text-subtle: #6f7f97;
      --easy: #63d6ad;
      --medium: #f1bd62;
      --hard: #ff8192;
      --mono: "Fira Code", "SFMono-Regular", Consolas, monospace;
      --font: "Plus Jakarta Sans", "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
      --radius: 7px;
      --radius-lg: 11px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* 關掉 Fira Code 連字，學生才看得到真正要打的 <=、==。 */
    *, *::before, *::after { font-variant-ligatures: none !important; }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid #8eb0ff;
      outline-offset: 2px;
    }

    /* ─── Header：與 algoplay/core/base.css、flow-lab.css 同一組規格 ─── */
    header {
      background: rgba(12, 13, 18, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(16px, 3vw, 28px);
      height: 52px;
      display: flex;
      align-items: center;
      gap: 18px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
      flex: none;
    }

    .logo::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: var(--accent);
      flex: none;
    }

    .header-divider {
      height: 18px;
      width: 1px;
      background: var(--border);
      flex: none;
    }

    .header-label {
      font-size: 0.8125rem;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
    }

    .header-label:hover {
      color: var(--text);
    }

    header nav {
      margin-left: auto;
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8125rem;
      white-space: nowrap;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-link:hover {
      color: var(--text);
    }

    /* Python 環境只是背景狀態，不該比導覽列還搶眼：一顆點 + 一行灰字 */
    .badge-pyodide {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: var(--text-subtle);
      white-space: nowrap;
    }

    .pyodide-loading .dot { background: var(--warning); }
    .pyodide-ready { color: var(--text-subtle); }
    .pyodide-ready .dot { background: var(--success); }
    .pyodide-error { color: var(--danger); }
    .pyodide-error .dot { background: var(--danger); }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
    }

    .dot.pulse {
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1 }
      50% { opacity: 0.25 }
    }

    /* ─── Views ─── */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ─── Problem List ─── */
    #view-list {
      max-width: 1180px;
      margin: 44px auto;
      padding: 0 24px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .list-heading {
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .list-heading .page-title {
      margin-bottom: 0;
      font-size: clamp(1.7rem, 3.4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .filter-result-count {
      color: var(--text-subtle);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    /* 篩選列是工具不是內容：搜尋框保持明顯，下拉選單一律退後一階 */
    .problem-filters {
      margin-bottom: 16px;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(240px, 1.6fr) repeat(4, minmax(108px, 0.7fr)) auto;
      gap: 8px;
      border: 0;
      background: transparent;
    }

    .filter-field {
      min-width: 0;
    }

    .filter-field label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .filter-field input,
    .filter-field select,
    .filter-reset {
      width: 100%;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
      font: inherit;
      font-size: 0.84rem;
    }

    .filter-field select,
    .filter-reset {
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-field select:hover,
    .filter-reset:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    #problem-search {
      background: var(--surface);
      padding-left: 34px;
    }

    .filter-field:first-child {
      position: relative;
    }

    .filter-field:first-child::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 50%;
      width: 13px;
      height: 13px;
      margin-top: -8px;
      border: 1.6px solid var(--text-subtle);
      border-radius: 50%;
      pointer-events: none;
    }

    .filter-field:first-child::after {
      content: "";
      position: absolute;
      left: 22px;
      top: 50%;
      width: 6px;
      height: 1.6px;
      margin-top: 3px;
      background: var(--text-subtle);
      transform: rotate(45deg);
      transform-origin: left center;
      pointer-events: none;
    }

    .filter-field input:focus,
    .filter-field select:focus,
    .filter-reset:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(59, 130, 246, 0.24);
      outline-offset: 1px;
    }

    .filter-reset {
      width: auto;
      font-size: 0.82rem;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
    }

    .pagination:empty {
      margin-top: 0;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .page-btn:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(59, 130, 246, 0.24);
      outline-offset: 1px;
    }

    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .page-ellipsis {
      padding: 0 4px;
      color: var(--text-muted);
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .problem-table {
      width: 100%;
      border-collapse: collapse;
      background: transparent;
      min-width: 840px;
      border: 0;
      overflow: hidden;
      table-layout: fixed;
    }

    .problem-table th {
      background: var(--surface);
      padding: 11px 16px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-subtle);
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    .problem-table td {
      padding: 0 16px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .problem-table tr:last-child td {
      border-bottom: none;
    }

    .problem-table tr:hover td {
      background: rgba(255, 255, 255, 0.035);
    }

    /* 題號只是索引，用等寬字排齊、壓到最暗 */
    .problem-table td:first-child {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-subtle) !important;
      font-weight: 400 !important;
    }

    /* 題目名稱＝這一列唯一要點的東西，所以是全列最亮、最重 */
    .problem-title-link {
      color: var(--accent-ink);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: color 0.16s;
    }

    .problem-table tr:hover .problem-title-link,
    .problem-title-link:hover {
      color: #ffffff;
    }

    /* 標籤欄固定單行，超出的淡出——列高一致，眼睛才掃得動 */
    .problem-table td.cell-tags {
      overflow: hidden;
      white-space: nowrap;
      -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 78%, transparent 100%);
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 難度：降成「一顆點＋文字」，不再是整列最亮的色塊 */
    .badge-easy,
    .badge-medium,
    .badge-hard {
      background: transparent;
      padding: 0;
      font-weight: 500;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-easy::before,
    .badge-medium::before,
    .badge-hard::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
    }

    .badge-easy { color: var(--easy); }
    .badge-medium { color: var(--medium); }
    .badge-hard { color: var(--hard); }

    /* 階段＝課程分組，保留色塊，是第二層級 */
    .badge-stage-beginner {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
    }

    .badge-stage-intermediate {
      background: rgba(109, 213, 237, 0.14);
      color: #8fdcef;
    }

    .badge-stage-advanced {
      background: rgba(182, 156, 255, 0.16);
      color: #c9b6ff;
    }

    .badge-stage-challenge {
      background: rgba(255, 129, 146, 0.15);
      color: #ffa4b1;
    }

    .badge-stage-unclassified {
      background: var(--surface2);
      color: var(--text-muted);
    }

    .badge-apcs {
      background: rgba(241, 189, 98, 0.15);
      color: var(--warning);
    }

    .meta-audience {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.68rem;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--border);
      color: var(--text-subtle);
      margin-right: 4px;
    }

    /* 未完成＝安靜；已完成＝一個綠勾，讓學生一眼看到自己走到哪 */
    .ac-rate {
      color: var(--text-subtle);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .status-icon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--success);
      white-space: nowrap;
    }

    .status-icon::before {
      content: "✓";
      font-size: 0.9rem;
      line-height: 1;
    }

    /* ─── Problem Detail ─── */
    #view-problem {
      display: none;
      flex-direction: column;
      height: calc(100vh - 52px);
    }

    #view-problem.active {
      display: flex;
    }

    .problem-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 這裡只是「你現在在哪一題」的提示，真正的標題在左欄，所以壓低一階 */
    .problem-header-title {
      min-width: 120px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .judge-answer-controls {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .judge-answer-controls .programming-toolbar {
      min-width: 0;
      padding: 0;
      flex-wrap: nowrap;
      gap: 8px;
      border-bottom: 0;
      background: transparent;
    }

    .judge-answer-controls .programming-status {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #view-problem .programming-help {
      display: none !important;
    }

    .split-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left panel */
    .desc-panel {
      width: 38%;
      min-width: 320px;
      overflow-y: auto;
      padding: 22px 24px 40px;
      border-right: 1px solid var(--border);
    }

    .desc-panel h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .desc-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .desc-meta span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 小節標題＝在長長的捲動裡定位用的地標，必須比內文「更亮」而不是更淡。
       左側藍色短線讓每個段落的起點一眼看得到。 */
    .section-title {
      position: relative;
      padding-left: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
      margin-top: 26px;
      margin-bottom: 10px;
    }

    .section-title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.3em;
      bottom: 0.3em;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
    }

    .section-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .samples-help-link {
      text-transform: none;
      letter-spacing: normal;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--text-subtle);
      text-decoration: none;
    }

    .samples-help-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .desc-panel p,
    .desc-panel li {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .desc-panel ul {
      padding-left: 20px;
    }

    .problem-lead {
      margin-bottom: 14px;
      color: var(--text) !important;
      font-size: 1.05rem !important;
      font-weight: 650;
    }

    .problem-hint {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .problem-hint summary {
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 650;
      cursor: pointer;
    }

    .problem-hint-content {
      padding: 0 14px 14px;
      color: var(--text-muted);
    }

    .problem-hint-content pre {
      margin-top: 8px;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.8rem;
    }

    .sample-block {
      background: var(--surface-dark);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .sample-block-header {
      background: var(--surface);
      padding: 4px 10px;
      font-size: 0.68rem;
      color: var(--text-subtle);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .sample-block pre {
      padding: 9px 10px;
      font-family: var(--mono);
      font-size: 0.82rem;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    /* 每行一列、左側行號，讓「一行折成兩行」和「本來就是兩行」一眼可辨 */
    .sample-lines {
      padding: 9px 10px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: #e2e8f0;
    }

    .sample-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .sample-line + .sample-line {
      margin-top: 2px;
    }

    .sample-line-no {
      flex: 0 0 auto;
      min-width: 1.8em;
      text-align: right;
      color: var(--text-subtle);
      user-select: none;
    }

    .sample-line-content {
      flex: 1 1 auto;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .sample-line-break {
      margin-left: 2px;
      color: var(--text-subtle);
      user-select: none;
    }

    .sample-pair + .sample-pair {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .sample-pair-title {
      margin-bottom: 6px;
      color: var(--text-subtle);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .sample-pair-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .sample-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .limits-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .limit-item {
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--border);
      border-radius: var(--radius);
      padding: 5px 11px;
      font-size: 0.76rem;
      color: var(--text-subtle);
    }

    .limit-item strong {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Right panel */
    .editor-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .focus-mode-btn,
    .problem-header .btn-secondary {
      padding: 6px 11px !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      background: transparent;
      font-size: 0.78rem !important;
      font-weight: 500;
      cursor: pointer;
    }

    .focus-mode-btn:hover,
    .problem-header .btn-secondary:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    body.judge-focus .desc-panel {
      display: none;
    }

    .lang-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: var(--radius);
      font-size: 0.85rem;
    }

    .editor-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .editor-area .CodeMirror {
      height: 100%;
      font-size: 13.5px;
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    }

    /* ── CodeMirror gutter 根本修正 ──
       根本原因：
         1. view-problem 初始為 display:none，CodeMirror 在不可見狀態下
            無法測量 gutter 寬度，導致程式碼行沒有足夠的左邊距。
         2. position:absolute 的強制覆寫可能與 CM 內部計算互相干擾。
       解法：
         - 只覆寫顏色與 z-index，不覆寫 position（讓 CM 自己管）
         - 在切換到題目 view 後呼叫 editor.refresh() 重新測量
    */
    .CodeMirror {
      position: relative !important;
      overflow: hidden !important;
      /* 讓 gutter 正確 clip */
    }

    .editor-area .CodeMirror,
    .editor-area .CodeMirror-scroll {
      background: var(--surface-dark) !important;
    }

    .CodeMirror-gutters {
      background: var(--surface-dark) !important;
      border-right: 1px solid var(--border) !important;
      z-index: 3 !important;
      white-space: nowrap !important;
      min-height: 100% !important;
      /* 不覆寫 position/left/top：讓 CodeMirror 自行計算 */
    }

    .CodeMirror-linenumber {
      padding: 0 10px 0 8px !important;
      min-width: 24px !important;
      text-align: right !important;
      color: var(--text-subtle) !important;
      white-space: nowrap !important;
    }

    .CodeMirror-cursor { border-left-color: #8eb0ff !important; }
    .CodeMirror-selected { background: rgba(59, 130, 246, 0.22) !important; }
    .CodeMirror-activeline-background { background: rgba(255, 255, 255, 0.028) !important; }

    /* 確保程式碼區域不從 gutter 下方開始 */
    .CodeMirror-sizer {
      position: relative !important;
      border-right: 1px solid transparent !important;
    }

    .CodeMirror-scroll {
      /* 維持 CM 預設 overflow 行為，不強制覆寫 */
      outline: none;
    }

    .CodeMirror-lines {
      padding: 4px 0 !important;
    }

    .submit-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 20px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      background: var(--surface2);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .submit-hint {
      font-size: 0.78rem;
      color: var(--text-subtle);
      margin-left: auto;
    }

    /* Results */
    .results-panel {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      z-index: 70;
      max-height: min(42vh, 380px);
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
    }

    .results-panel.collapsed {
      max-height: 48px;
    }

    .results-panel.collapsed .results-drawer-body {
      display: none;
    }

    .results-drawer-header {
      min-height: 46px;
      padding: 8px 10px 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .results-panel.collapsed .results-drawer-header {
      border-bottom: 0;
    }

    .results-drawer-title {
      color: #e2e8f0;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 結果列是整個流程的終點，收合時也要一眼看出過或沒過 */
    .results-panel[data-verdict] {
      border-left: 3px solid var(--border-strong);
    }

    .results-panel[data-verdict="AC"] {
      border-color: rgba(99, 214, 173, 0.45);
      border-left-color: var(--success);
    }

    .results-panel[data-verdict="AC"] .results-drawer-header {
      background: linear-gradient(90deg, rgba(99, 214, 173, 0.12), transparent 60%);
    }

    .results-panel[data-verdict="AC"] .results-drawer-title {
      color: var(--success);
    }

    .results-panel[data-verdict="AC"] .results-drawer-title::before {
      content: "✓";
      font-size: 0.95rem;
    }

    .results-panel[data-verdict="WA"],
    .results-panel[data-verdict="RE"] {
      border-color: rgba(255, 129, 146, 0.45);
      border-left-color: var(--danger);
    }

    .results-panel[data-verdict="WA"] .results-drawer-header,
    .results-panel[data-verdict="RE"] .results-drawer-header {
      background: linear-gradient(90deg, rgba(255, 129, 146, 0.12), transparent 60%);
    }

    .results-panel[data-verdict="WA"] .results-drawer-title,
    .results-panel[data-verdict="RE"] .results-drawer-title {
      color: var(--danger);
    }

    .results-panel[data-verdict="TLE"] {
      border-color: rgba(241, 189, 98, 0.45);
      border-left-color: var(--warning);
    }

    .results-panel[data-verdict="TLE"] .results-drawer-header {
      background: linear-gradient(90deg, rgba(241, 189, 98, 0.12), transparent 60%);
    }

    .results-panel[data-verdict="TLE"] .results-drawer-title {
      color: var(--warning);
    }

    .results-drawer-summary {
      min-width: 0;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .results-drawer-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .results-drawer-actions button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #cbd5e1;
      background: var(--surface2);
      cursor: pointer;
    }

    .results-drawer-actions button:hover {
      border-color: var(--accent);
      color: white;
    }

    .results-drawer-body {
      min-height: 0;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .result-summary-pill {
      max-width: 220px;
      margin-left: auto;
      padding: 5px 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      background: var(--surface);
      font-size: 0.75rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .result-summary-pill.success {
      border-color: rgba(99, 214, 173, 0.5);
      color: var(--success);
      background: rgba(99, 214, 173, 0.14);
      font-weight: 700;
    }

    .result-summary-pill.error {
      border-color: rgba(255, 129, 146, 0.38);
      color: #ffb3bd;
      background: rgba(255, 129, 146, 0.1);
    }

    .result-summary-pill:not([hidden]) + .submit-hint {
      margin-left: 0;
    }

    .results-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-subtle);
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .verdict-banner {
      padding: 13px 18px;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .verdict-AC {
      background: rgba(99, 214, 173, 0.15);
      color: var(--success);
      border: 1px solid rgba(99, 214, 173, 0.3);
    }

    .verdict-WA {
      background: rgba(255, 129, 146, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 129, 146, 0.3);
    }

    .verdict-RE {
      background: rgba(255, 129, 146, 0.15);
      color: #ff9aa8;
      border: 1px solid rgba(255, 129, 146, 0.3);
    }

    .verdict-TLE {
      background: rgba(241, 189, 98, 0.15);
      color: var(--warning);
      border: 1px solid rgba(241, 189, 98, 0.3);
    }

    .verdict-PE {
      background: rgba(109, 213, 237, 0.15);
      color: var(--info);
      border: 1px solid rgba(109, 213, 237, 0.3);
    }

    .tc-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tc-chip {
      padding: 6px 14px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tc-chip:hover {
      filter: brightness(1.2);
    }

    .tc-AC {
      background: rgba(99, 214, 173, 0.15);
      color: var(--success);
      border-color: rgba(99, 214, 173, 0.3);
    }

    .tc-WA {
      background: rgba(255, 129, 146, 0.15);
      color: var(--danger);
      border-color: rgba(255, 129, 146, 0.3);
    }

    .tc-RE {
      background: rgba(255, 129, 146, 0.15);
      color: #ff9aa8;
      border-color: rgba(255, 129, 146, 0.3);
    }

    .tc-TLE {
      background: rgba(241, 189, 98, 0.15);
      color: var(--warning);
      border-color: rgba(241, 189, 98, 0.3);
    }

    .tc-running {
      background: var(--surface2);
      color: var(--text-muted);
    }

    .error-block {
      background: rgba(255, 129, 146, 0.1);
      border: 1px solid rgba(255, 129, 146, 0.3);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #ffb3bd;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }

    .diff-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .diff-side {
      background: var(--surface-dark);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .diff-side-header {
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .diff-expected .diff-side-header {
      background: rgba(99, 214, 173, 0.2);
      color: var(--success);
    }

    .diff-actual .diff-side-header {
      background: rgba(255, 129, 146, 0.2);
      color: var(--danger);
    }

    .diff-side pre {
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }

    /* Running spinner overlay */
    .running-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 50;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .running-overlay.show {
      display: flex;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .running-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s;
      z-index: 9999;
      max-width: 320px;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85em;
      color: #93c5fd;
    }

    @media (max-width: 980px) {
      .problem-filters {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .problem-filters .filter-field:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      /* 手機上先砍掉次要欄位，讓「題名／階段／完成沒完成」不用左右滑就看得到 */
      .problem-table { min-width: 0; }

      .problem-table th:nth-child(4),
      .problem-table td:nth-child(4),
      .problem-table th:nth-child(5),
      .problem-table td:nth-child(5) {
        display: none;
      }

      .problem-table th,
      .problem-table td {
        padding: 0 10px;
      }

      header { height:auto; min-height:52px; padding:8px 14px; gap:10px; flex-wrap:wrap; }
      header .logo, header .nav-link { white-space:nowrap; flex-shrink:0; }
      header .header-divider { display:none; }
      header nav { gap:14px; }
      header .badge-pyodide { font-size:0.7rem; }
      .split-layout {
        flex-direction: column;
      }

      #view-list {
        margin: 26px auto;
        padding: 0 14px;
      }

      .list-heading {
        align-items: start;
        flex-direction: column;
        gap: 8px;
      }

      .problem-filters {
        grid-template-columns: 1fr 1fr;
      }

      .problem-filters .filter-field:first-child {
        grid-column: 1 / -1;
      }

      .desc-panel {
        width: 100%;
        height: 40%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .problem-header {
        padding: 10px 12px;
        gap: 8px;
        flex-wrap: wrap;
      }

      .problem-header-title {
        min-width: 140px;
      }

      .judge-answer-controls {
        width: 100%;
        order: 5;
      }

      .judge-answer-controls .programming-toolbar {
        width: 100%;
      }

      .judge-answer-controls .programming-status {
        max-width: none;
        flex: 1 1 auto;
        flex-basis: auto;
      }

      .sample-pair-grid {
        grid-template-columns: 1fr;
      }

      .focus-mode-btn {
        display: none;
      }

      .results-panel {
        right: 8px;
        bottom: 8px;
        left: 8px;
        max-height: min(55vh, 380px);
      }

      .submit-hint {
        display: none;
      }

      .result-summary-pill {
        max-width: 150px;
      }
    }
  </style>
</head>

<body>

  <!-- ══════════════ Header ══════════════ -->
  <header>
    <a class="logo" href="index.html">ThinkLab</a>
    <span class="header-divider"></span>
    <span class="header-label" onclick="showView('list')" role="link" tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showView('list');}">題庫</span>
    <div id="pyodide-badge" class="badge-pyodide pyodide-loading">
      <div class="dot pulse"></div>
      <span id="pyodide-status">載入 Python 環境中…</span>
    </div>
    <nav>
      <a class="nav-link" href="guide.html">驗資說明</a>
      <a class="nav-link" href="beginner.html">LV.1 講義</a>
      <a class="nav-link" href="index.html">學習選單</a>
    </nav>
  </header>

  <!-- ══════════════ View: Problem List ══════════════ -->
  <div id="view-list" class="view active">
    <div id="view-list-inner">
      <div class="list-heading">
        <div class="page-title">題目列表</div>
        <div class="filter-result-count" id="filter-result-count" aria-live="polite">載入題目中</div>
      </div>
      <form class="problem-filters" id="problem-filters" role="search" onsubmit="return false">
        <div class="filter-field">
          <label for="problem-search">搜尋題號、名稱、標籤或分級</label>
          <input id="problem-search" type="search" placeholder="搜尋題號、名稱、標籤或分級" autocomplete="off">
        </div>
        <div class="filter-field">
          <label for="stage-filter">依學習階段篩選</label>
          <select id="stage-filter">
            <option value="">所有階段</option>
            <option value="Beginner">LV.1</option>
            <option value="Intermediate">LV.2</option>
            <option value="Advanced">LV.3</option>
            <option value="Challenge">挑戰</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="difficulty-filter">依難度篩選</label>
          <select id="difficulty-filter">
            <option value="">所有難度</option>
            <option value="Easy">簡單</option>
            <option value="Medium">中等</option>
            <option value="Hard">困難</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="tag-filter">依標籤篩選</label>
          <select id="tag-filter"><option value="">所有標籤</option></select>
        </div>
        <div class="filter-field">
          <label for="status-filter">依完成狀態篩選</label>
          <select id="status-filter">
            <option value="">所有狀態</option>
            <option value="solved">已完成</option>
            <option value="unsolved">未完成</option>
          </select>
        </div>
        <button class="filter-reset" id="filter-reset" type="button">清除</button>
      </form>
      <div class="table-scroll">
        <table class="problem-table">
        <thead>
          <tr>
            <th style="width:64px">#</th>
            <th>題目名稱</th>
            <th style="width:84px">階段</th>
            <th style="width:186px">標籤</th>
            <th style="width:88px">難度</th>
            <th style="width:96px">狀態</th>
          </tr>
        </thead>
        <tbody id="problem-tbody"></tbody>
        </table>
      </div>
      <nav class="pagination" id="problem-pagination" aria-label="題目列表分頁"></nav>
    </div>
  </div>

  <!-- ══════════════ View: Problem Detail ══════════════ -->
  <div id="view-problem" class="view">
    <div class="problem-header">
      <button class="back-btn" onclick="showView('list')">← 返回列表</button>
      <div class="problem-header-title" id="problem-header-title">—</div>
      <div class="judge-answer-controls" id="judge-answer-controls" aria-label="作答設定"></div>
      <button id="focus-mode-btn" class="focus-mode-btn" type="button" onclick="toggleJudgeFocus()">放大編輯區</button>
      <button id="reset-code-btn" class="btn btn-secondary" onclick="resetCode()">重置</button>
    </div>
    <div class="split-layout">
      <!-- Left: Description -->
      <div class="desc-panel" id="desc-panel">
        <h1 id="p-title">—</h1>
        <div class="desc-meta" id="p-meta"></div>
        <div class="section-title">題目說明</div>
        <div id="p-desc"></div>
        <div class="section-title">輸入格式</div>
        <div id="p-input-fmt"></div>
        <div class="section-title">輸出格式</div>
        <div id="p-output-fmt"></div>

      const badge = document.getElementById('pyodide-badge');
      const status = document.getElementById('pyodide-status');
      const dot = badge.querySelector('.dot');
      badge.className = 'badge-pyodide';
      dot.className = 'dot';
      if (state === 'ready') {
        badge.classList.add('pyodide-ready');
        status.textContent = 'Python 已就緒';
        document.getElementById('submit-hint').textContent = '';
      } else if (state === 'error') {
        badge.classList.add('pyodide-error');
        status.textContent = '載入失敗，請重新整理';
        document.getElementById('submit-hint').textContent = '環境載入失敗';
      } else {
        badge.classList.add('pyodide-loading');
        status.textContent = '載入 Python 環境中…';
        dot.classList.add('pulse');
      }
    }

    function setSubmitEnabled(v) {
      const disabled = !v || running || loadingProblem || !currentProblem;
      document.getElementById('submit-btn').disabled = disabled;
      document.getElementById('sample-btn').disabled = disabled;
      document.getElementById('reset-code-btn').disabled = disabled;
      if (programmingEditor) programmingEditor.setDisabled(disabled);
      document.getElementById('submit-hint').textContent = running ? '評測中…' : 'Ctrl / ⌘ + Enter 提交';
    }

    // Each test receives fresh globals and an exact stdin stream.
    async function runPython(code, inputStr) {
      const runtime = await initPyodide();
      runtime.globals.set('_skilllab_code', code);
      runtime.globals.set('_skilllab_input', inputStr);
      const t0 = performance.now();
      try {
        await runtime.runPythonAsync(`
import sys as _sl_sys, io as _sl_io
_sl_old = (_sl_sys.stdin, _sl_sys.stdout, _sl_sys.stderr)
_sl_out, _sl_err = _sl_io.StringIO(), _sl_io.StringIO()
_sl_sys.stdin = _sl_io.StringIO(_skilllab_input)
_sl_sys.stdout, _sl_sys.stderr = _sl_out, _sl_err
try:
    exec(compile(_skilllab_code, '<student>', 'exec'), {'__name__': '__main__'})
finally:
    _sl_sys.stdin, _sl_sys.stdout, _sl_sys.stderr = _sl_old
`);
        return { output: runtime.runPython('_sl_out.getvalue()'), errout: runtime.runPython('_sl_err.getvalue()'), elapsed: performance.now() - t0 };
      } finally {
        runtime.globals.delete('_skilllab_code');
        runtime.globals.delete('_skilllab_input');
      }
    }

    // ═══════════════════════════════════════════════
    //  JUDGE
    // ═══════════════════════════════════════════════
    async function judgeAll(problem, snapshot) {
      const results = [];
      for (let i = 0; i < problem.testCases.length; i++) {
        const tc = problem.testCases[i];
        try {
          const { output, errout, elapsed } = await programmingEditor.run(snapshot, tc.input, problem.timeLimit * 1000, runPython);
          const actual = output.trimEnd();
          const expected = tc.output.trimEnd();
          if (errout.startsWith('TLE') || elapsed > problem.timeLimit * 1000) {
            results.push({ status: 'TLE', elapsed, actual, expected });
          } else if (errout.trim()) {
            results.push({ status: 'RE', elapsed, error: errout, actual, expected });
          } else if (actual === expected) {
            results.push({ status: 'AC', elapsed, actual, expected });
          } else {
            results.push({ status: 'WA', elapsed, actual, expected });
          }
        } catch (e) {
          results.push({ status: e.message.startsWith('TLE') ? 'TLE' : 'RE', elapsed: e.message.startsWith('TLE') ? problem.timeLimit * 1000 : 0, error: e.message, actual: '', expected: tc.output });
        }
        // Update chip as we go
        renderResultsPartial(results, problem.testCases.length);
      }
      return results;
    }

    function getPublicSamples(problem) {
      if (Array.isArray(problem.samples) && problem.samples.length) {
        return problem.samples.map(sample => ({
          input: String(sample.input ?? ''),
          output: String(sample.output ?? ''),
          explanation: sample.explanation ? String(sample.explanation) : ''
        }));
      }
      return [{ input: String(problem.sampleInput ?? ''), output: String(problem.sampleOutput ?? ''), explanation: '' }];
    }

    async function judgePublicSamples(problem, snapshot) {
      const samples = getPublicSamples(problem);
      const results = [];
      renderSampleResultsLoading(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const sample = samples[i];
        try {
          const { output, errout, elapsed } = await programmingEditor.run(snapshot, sample.input, problem.timeLimit * 1000, runPython);
          const actual = output.trimEnd();
          const expected = sample.output.trimEnd();
          const status = errout.startsWith('TLE') || elapsed > problem.timeLimit * 1000
            ? 'TLE'
            : errout.trim() ? 'RE' : actual === expected ? 'AC' : 'WA';
          results.push({ status, elapsed, error: status === 'RE' ? errout.trim() : '', actual, expected });
        } catch (error) {
          results.push({
            status: error.message.startsWith('TLE') ? 'TLE' : 'RE',
            elapsed: error.message.startsWith('TLE') ? problem.timeLimit * 1000 : 0,
            error: error.message,
            actual: '',
            expected: sample.output.trimEnd()
          });
        }
        renderSampleResultsPartial(results);
      }
      return results;
    }

    // ═══════════════════════════════════════════════
    //  SUBMIT
    // ═══════════════════════════════════════════════
    async function executeAnswer(sampleOnly) {
      if (running || loadingProblem || !currentProblem) return;
      const problem = currentProblem;
      running = true;
      setSubmitEnabled(false);
      showRunning(true, sampleOnly ? '執行範例測資…' : '評測中，請稍候…');
      try {
        const snapshot = await programmingEditor.snapshot();
        if (snapshot.language !== 'scratch' && !snapshot.code.trim()) throw new Error('請先寫下程式或拖入積木。');
        if (sampleOnly) {
          const results = await judgePublicSamples(problem, snapshot);
          renderSampleResultsFinal(results);
        } else {
          renderResultsLoading(problem.testCases.length);
          const results = await judgeAll(problem, snapshot);
          renderResultsFinal(results, problem);
          if (results.every(result => result.status === 'AC')) {
            solvedSet.add(problem.id);
            localStorage.setItem('solved', JSON.stringify([...solvedSet]));
            toast('所有測資通過。');
          }
        }
      } catch (error) {
        renderError(error.message);
      } finally {
        running = false;
        showRunning(false);
        setSubmitEnabled(true);
      }
    }

    function submitCode() { return executeAnswer(false); }
    function runSample() { return executeAnswer(true); }

    // ═══════════════════════════════════════════════
    //  RENDER RESULTS
    // ═══════════════════════════════════════════════
    const STATUS_LABEL = { AC: 'AC', WA: 'WA', TLE: 'TLE', RE: 'RE' };
    const STATUS_DESC = { AC: '全部通過', WA: '答案錯誤', TLE: '超過時間限制', RE: '執行時期錯誤' };

    function setResultSummary(text, state = '') {
      const summary = document.getElementById('result-summary-pill');
      summary.hidden = false;
      summary.textContent = text;
      summary.className = `result-summary-pill ${state}`.trim();
      summary.setAttribute('aria-label', `${text}，開啟詳細結果`);
    }

    function renderResultDrawer(title, summary, body, { collapsed = false, verdict = '' } = {}) {
      const panel = document.getElementById('results-panel');
      panel.style.display = 'flex';
      panel.classList.toggle('collapsed', collapsed);
      // 只用於上色，不參與任何判定
      if (verdict) panel.dataset.verdict = verdict; else delete panel.dataset.verdict;
      panel.innerHTML = `
        <div class="results-drawer-header">
          <span class="results-drawer-title">${escHtml(title)}</span>
          <span class="results-drawer-summary">${escHtml(summary)}</span>
          <span class="results-drawer-actions">
            <button class="results-collapse-btn" type="button" onclick="toggleResultsPanel()" aria-label="${collapsed ? '展開' : '收合'}結果">${collapsed ? '⌃' : '⌄'}</button>
            <button type="button" onclick="closeResultsPanel()" aria-label="關閉結果">×</button>
          </span>
        </div>
        <div class="results-drawer-body">${body}</div>`;
    }

    function toggleResultsPanel() {
      const panel = document.getElementById('results-panel');
      const collapsed = panel.classList.toggle('collapsed');
      const button = panel.querySelector('.results-collapse-btn');
      if (button) {
        button.textContent = collapsed ? '⌃' : '⌄';
        button.setAttribute('aria-label', collapsed ? '展開結果' : '收合結果');
      }
    }

    function openResultsPanel() {
      const panel = document.getElementById('results-panel');
      if (!panel.innerHTML) return;
      panel.style.display = 'flex';
      panel.classList.remove('collapsed');
      const button = panel.querySelector('.results-collapse-btn');
      if (button) {
        button.textContent = '⌄';
        button.setAttribute('aria-label', '收合結果');
      }
    }

    function closeResultsPanel() {
      document.getElementById('results-panel').style.display = 'none';
    }

    function clearResultsPanel() {
      const panel = document.getElementById('results-panel');
      panel.style.display = 'none';
      panel.classList.remove('collapsed');
      panel.innerHTML = '';
      const summary = document.getElementById('result-summary-pill');
      summary.hidden = true;
      summary.textContent = '';
      summary.className = 'result-summary-pill';
      window._lastResults = null;
    }

    function renderResultsLoading(n) {
      let chips = '';
      for (let i = 0; i < n; i++) chips += `<div class="tc-chip tc-running" id="tc-chip-${i}">測資 ${i + 1}</div>`;
      renderResultDrawer('評測結果', `正在執行 0 / ${n}`, `<div class="tc-grid" id="tc-grid">${chips}</div>`);
      setResultSummary('評測中…');
    }

    function renderResultsPartial(results, total) {
      results.forEach((r, i) => {
        const chip = document.getElementById('tc-chip-' + i);
        if (chip) {
          const t = r.elapsed ? ` (${r.elapsed.toFixed(0)}ms)` : '';
          chip.className = `tc-chip tc-${r.status}`;
          chip.textContent = `測資 ${i + 1} ${STATUS_LABEL[r.status]}${t}`;
        }
      });
      const summary = document.querySelector('.results-drawer-summary');
      if (summary) summary.textContent = `正在執行 ${results.length} / ${total}`;
    }

    function renderResultsFinal(results, problem) {
      const panel = document.getElementById('results-panel');
      const allAC = results.every(r => r.status === 'AC');
      const worstStatus = allAC ? 'AC' :
        results.find(r => r.status === 'RE') ? 'RE' :
          results.find(r => r.status === 'TLE') ? 'TLE' : 'WA';
      const passCount = results.filter(r => r.status === 'AC').length;
      const maxTime = Math.max(...results.map(r => r.elapsed || 0));

      let html = `<div class="verdict-banner verdict-${worstStatus}">
    <span>${allAC ? '通過' : '未通過'}</span>
    <span>${STATUS_LABEL[worstStatus]} — ${passCount}/${results.length} 通過</span>
    <span style="margin-left:auto;font-size:0.8rem;font-weight:400;color:inherit;opacity:0.8">最長 ${maxTime.toFixed(0)} ms</span>
  </div>`;
      html += `<div class="tc-grid">`;
      results.forEach((r, i) => {
        const t = r.elapsed ? ` · ${r.elapsed.toFixed(0)}ms` : '';
        html += `<div class="tc-chip tc-${r.status}" onclick="showTcDetail(${i})" title="點擊查看詳情">
      測資 ${i + 1} ${STATUS_LABEL[r.status]}${t}
    </div>`;
      });
      html += `</div>`;

      // Show first non-AC detail
      const firstBad = results.findIndex(r => r.status !== 'AC');
      if (firstBad >= 0) {
        html += renderTcDetail(results[firstBad], firstBad);
      }

      const summary = `${STATUS_DESC[worstStatus]} · ${passCount}/${results.length} 通過`;
      renderResultDrawer('評測結果', summary, html, { collapsed: allAC, verdict: worstStatus });
      setResultSummary(`${passCount}/${results.length} 通過`, allAC ? 'success' : 'error');
      window._lastResults = results;
      window._lastResultLabel = '測資';
    }

    function renderTcDetail(r, i, label = '測資') {
      let html = `<div style="margin-top:12px;font-size:0.8rem;color:var(--text-muted);">
    ── ${label} ${i + 1} 詳情 ──
  </div>`;
      if (r.status === 'RE' || r.error) {
        html += `<div class="error-block">${escHtml(r.error || '未知錯誤')}</div>`;
      } else if (r.status === 'WA') {
        html += `<div class="diff-block">
      <div class="diff-side diff-expected">
        <div class="diff-side-header">期望輸出</div>
        <pre>${escHtml(r.expected)}</pre>
      </div>
      <div class="diff-side diff-actual">
        <div class="diff-side-header">你的輸出</div>
        <pre>${escHtml(r.actual)}</pre>
      </div>
    </div>`;
      } else if (r.status === 'TLE') {
        html += `<div style="color:var(--warning);font-size:0.85rem;margin-top:8px;">
      ⏱ 執行時間 ${r.elapsed?.toFixed(0)} ms，超過時間限制 ${currentProblem.timeLimit * 1000} ms
    </div>`;
      }
      return html;
    }

    function showTcDetail(idx) {
      const r = window._lastResults?.[idx];
      if (!r) return;
      const panel = document.getElementById('results-panel');
      const existing = panel.querySelector('.tc-detail');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = 'tc-detail';
      div.innerHTML = renderTcDetail(r, idx, window._lastResultLabel || '測資');
      const body = panel.querySelector('.results-drawer-body');
      if (!body) return;
      body.appendChild(div);
      body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
    }

    function renderSampleResultsLoading(n) {
      let chips = '';
      for (let i = 0; i < n; i++) chips += `<div class="tc-chip tc-running" id="sample-chip-${i}">範例 ${i + 1}</div>`;
      renderResultDrawer('範例測試結果', `正在執行 0 / ${n}`, `<div class="tc-grid">${chips}</div>`);
      setResultSummary('範例測試中…');
    }

    function renderSampleResultsPartial(results) {
      results.forEach((result, index) => {
        const chip = document.getElementById('sample-chip-' + index);
        if (!chip) return;
        chip.className = `tc-chip tc-${result.status}`;
        chip.textContent = `範例 ${index + 1} ${STATUS_LABEL[result.status]}`;
      });
      const summary = document.querySelector('.results-drawer-summary');
      if (summary) summary.textContent = `正在執行 ${results.length} / ${getPublicSamples(currentProblem).length}`;
    }

    function renderSampleResultsFinal(results) {
      const allAC = results.every(result => result.status === 'AC');
      const passCount = results.filter(result => result.status === 'AC').length;
      const worstStatus = allAC ? 'AC' : results.find(result => result.status === 'RE') ? 'RE' : results.find(result => result.status === 'TLE') ? 'TLE' : 'WA';
      let html = `<div class="verdict-banner verdict-${worstStatus}">
        <span>${allAC ? '所有公開範例皆正確' : `${STATUS_LABEL[worstStatus]} — ${passCount}/${results.length} 通過`}</span>
      </div><div class="tc-grid">`;
      results.forEach((result, index) => {
        html += `<div class="tc-chip tc-${result.status}" onclick="showTcDetail(${index})" title="點擊查看詳情">範例 ${index + 1} ${STATUS_LABEL[result.status]}</div>`;
      });
      html += '</div>';
      const firstBad = results.findIndex(result => result.status !== 'AC');
      if (firstBad >= 0) html += renderTcDetail(results[firstBad], firstBad, '範例');
      const summary = `${allAC ? '全部通過' : STATUS_DESC[worstStatus]} · ${passCount}/${results.length}`;
      renderResultDrawer('範例測試結果', summary, html, { collapsed: allAC, verdict: worstStatus });
      setResultSummary(`範例 ${passCount}/${results.length}`, allAC ? 'success' : 'error');
      window._lastResults = results;
      window._lastResultLabel = '範例';
    }

    function renderError(msg) {
      renderResultDrawer('執行失敗', '請查看錯誤訊息', `<div class="verdict-banner verdict-RE">${escHtml(msg)}</div>`, { verdict: 'RE' });
      setResultSummary('執行失敗', 'error');
    }

    function toggleJudgeFocus() {
      const active = document.body.classList.toggle('judge-focus');
      const button = document.getElementById('focus-mode-btn');
      button.textContent = active ? '顯示題目' : '放大編輯區';
      button.setAttribute('aria-pressed', String(active));
      requestAnimationFrame(() => {
        editor?.refresh();
        window.dispatchEvent(new Event('resize'));
      });
    }

    // ═══════════════════════════════════════════════
    //  VIEWS
    // ═══════════════════════════════════════════════
    function showView(name) {
      if (running || loadingProblem) return;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      if (name === 'list') renderProblemList();
      if (name === 'problem' && editor) {
        // 切換到題目頁後，等瀏覽器完成 layout 再讓 CodeMirror 重新計算
        // gutter 寬度與 sizer 左邊距，這才是行號滲入程式碼的根本解法
        requestAnimationFrame(() => {
          editor.refresh();
          const editorArea = document.querySelector('.editor-area');
          if (editorArea && editorArea.offsetHeight > 0) {
            editor.setSize('100%', Math.max(260, editorArea.offsetHeight - document.getElementById('programming-editor').offsetHeight) + 'px');
          }
        });
      }
    }

    function renderProblemList() {
      const search = document.getElementById('problem-search').value.trim().toLocaleLowerCase('zh-TW');
      const stage = document.getElementById('stage-filter').value;
      const difficulty = document.getElementById('difficulty-filter').value;
      const tag = document.getElementById('tag-filter').value;
      const status = document.getElementById('status-filter').value;
      const tagSelect = document.getElementById('tag-filter');

      if (tagSelect.options.length === 1 && problemManifest.length) {
        const tags = [...new Set(problemManifest.flatMap(problem => problem.tags))]
          .sort((a, b) => a.localeCompare(b, 'zh-TW'));
        tags.forEach(value => tagSelect.add(new Option(value, value)));
      }

      const list = problemManifest.filter(problem => {
        const solved = solvedSet.has(problem.id);
        return PROBLEM_CLASSIFICATION.matches(problem, { search, stage, difficulty, tag, status }, solved);
      });

      const totalPages = Math.max(1, Math.ceil(list.length / PROBLEM_PAGE_SIZE));
      if (problemListPage > totalPages) problemListPage = totalPages;
      if (problemListPage < 1) problemListPage = 1;
      const pageStart = (problemListPage - 1) * PROBLEM_PAGE_SIZE;
      const pageItems = list.slice(pageStart, pageStart + PROBLEM_PAGE_SIZE);

      document.getElementById('filter-result-count').textContent = list.length
        ? `顯示 ${pageStart + 1}–${pageStart + pageItems.length} / ${list.length} 題（第 ${problemListPage} / ${totalPages} 頁）`
        : `顯示 0 / ${problemManifest.length} 題`;
      renderProblemPagination(totalPages);

      // Table
      const tbody = document.getElementById('problem-tbody');
      if (problemManifest.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">
      載入題目中…
    </td></tr>`;
        return;
      }
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:44px 24px">
      找不到符合條件的題目。請調整篩選條件。
    </td></tr>`;
        return;
      }
      tbody.innerHTML = pageItems.map(p => {
        const solved = solvedSet.has(p.id);
        const diff = p.difficulty.toLowerCase();
        const tags = p.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
        const stageMeta = PROBLEM_CLASSIFICATION.stageMeta(p.stage);
        const difficultyLabel = PROBLEM_CLASSIFICATION.difficultyLabel(p.difficulty);
        const solvedLabel = solved ? '<span class="status-icon" title="已完成">已完成</span>' : '<span class="ac-rate">未完成</span>';
        return `<tr>
      <td style="color:var(--text-muted);font-weight:600">${String(p.id).padStart(3, '0')}</td>
      <td><span class="problem-title-link" onclick="openProblem(${p.id})">${escHtml(p.title)}</span></td>
      <td><span class="badge badge-stage-${stageMeta.cssClass}">${stageMeta.label}</span></td>
      <td class="cell-tags">${tags}</td>
      <td><span class="badge badge-${diff}">${difficultyLabel}</span></td>
      <td>${solvedLabel}</td>
    </tr>`;
      }).join('');
    }

    function renderProblemPagination(totalPages) {
      const el = document.getElementById('problem-pagination');
      if (!el) return;
      if (totalPages <= 1) {
        el.innerHTML = '';
        return;
      }

      const pages = [];
      const addPage = p => { if (!pages.includes(p)) pages.push(p); };
      addPage(1);
      addPage(totalPages);
      for (let p = problemListPage - 1; p <= problemListPage + 1; p++) {
        if (p >= 1 && p <= totalPages) addPage(p);
      }
      pages.sort((a, b) => a - b);

      let html = `<button class="page-btn" type="button" ${problemListPage <= 1 ? 'disabled' : ''} onclick="goToProblemPage(${problemListPage - 1})" aria-label="上一頁">←</button>`;
      let prevPage = 0;
      pages.forEach(p => {
        if (p - prevPage > 1) html += `<span class="page-ellipsis">…</span>`;
        html += `<button class="page-btn${p === problemListPage ? ' active' : ''}" type="button" onclick="goToProblemPage(${p})" ${p === problemListPage ? 'aria-current="page"' : ''}>${p}</button>`;
        prevPage = p;
      });
      html += `<button class="page-btn" type="button" ${problemListPage >= totalPages ? 'disabled' : ''} onclick="goToProblemPage(${problemListPage + 1})" aria-label="下一頁">→</button>`;
      el.innerHTML = html;
    }

    function goToProblemPage(page) {
      problemListPage = page;
      renderProblemList();
      window.scrollTo(0, 0);
    }

    function resetProblemScroll() {
      // The list page, mobile layout, problem description, and result drawer
      // each have their own possible scroll position. A newly opened problem
      // must always begin at its heading rather than inheriting any of them.
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      document.querySelector('.desc-panel')?.scrollTo(0, 0);
      document.querySelector('.split-layout')?.scrollTo(0, 0);
      document.querySelector('.results-drawer-body')?.scrollTo(0, 0);
    }

    function splitProblemDescription(problem) {
      const description = document.createElement('div');
      description.innerHTML = problem.description || '';
      let hintHtml = problem.hint || '';

      if (!hintHtml) {
        const legacyHint = [...description.querySelectorAll('div')]
          .find(element => /^\s*(小)?提示[：:]?/.test(element.textContent.trim()));
        if (legacyHint) {
          const label = legacyHint.querySelector('p, strong');
          if (label && /提示/.test(label.textContent)) label.remove();
          hintHtml = legacyHint.innerHTML;
          legacyHint.remove();
        }
      }

      return { descriptionHtml: description.innerHTML, hintHtml };
    }

    function hasMeaningfulConstraints(html) {
      const container = document.createElement('div');
      container.innerHTML = html || '';
      const text = container.textContent.trim().replace(/[。.]$/, '');
      return Boolean(text) && !/^(無|none|不適用)$/i.test(text);
    }

    async function openProblem(id) {
      if (running || loadingProblem) return;
      // 先切換到題目頁，顯示載入中
      showView('problem');
      resetProblemScroll();
      loadingProblem = true;
      setSubmitEnabled(false);
      await programmingEditor.flush();
      document.getElementById('problem-header-title').textContent = '載入中…';
      document.getElementById('p-title').textContent = '載入中…';
      document.getElementById('p-desc').innerHTML = '<p style="color:var(--text-muted)">正在載入題目資料…</p>';
      document.getElementById('p-hint').hidden = true;
      document.getElementById('p-hint-content').innerHTML = '';
      clearResultsPanel();

      try {
        // 優先讀快取，再讀外部 JSON，最後讀內嵌備援
        let problem = problemCache[id];
        if (!problem) {
          try {
            problem = await fetchProblem(id);
            problemCache[id] = problem;
          } catch (e) {
            console.warn('Network load failed, checking embedded data fallback...', e);
            if (PROBLEMS_DATA[id]) {
              problem = PROBLEMS_DATA[id];
            } else {
              throw e;
            }
          }
        }
        currentProblem = problem;

        // 填入題目資訊
        document.getElementById('problem-header-title').textContent = `問題 ${id}：${problem.title}`;
        document.getElementById('p-title').textContent = `${String(id).padStart(3, '0')}. ${problem.title}`;

        const diff = problem.difficulty.toLowerCase();
        const stageMeta = PROBLEM_CLASSIFICATION.stageMeta(problem.stage);
        const difficultyLabel = PROBLEM_CLASSIFICATION.difficultyLabel(problem.difficulty);
        const audienceLabel = PROBLEM_CLASSIFICATION.audienceLabel(problem.audienceLevel);
        const apcsLabel = PROBLEM_CLASSIFICATION.apcsLabel(problem.apcsLevel);
        document.getElementById('p-meta').innerHTML = `
      <span class="badge badge-stage-${stageMeta.cssClass}">${stageMeta.label}</span>
      <span class="badge badge-${diff}">${difficultyLabel}</span>
      <span class="meta-audience">建議程度：${escHtml(audienceLabel)}</span>
      ${apcsLabel ? `<span class="badge badge-apcs">${escHtml(apcsLabel)}</span>` : ''}
      ${problem.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
    `;

        const { descriptionHtml, hintHtml } = splitProblemDescription(problem);
        document.getElementById('p-desc').innerHTML = descriptionHtml;
        document.getElementById('p-input-fmt').innerHTML = problem.inputFormat;
        document.getElementById('p-output-fmt').innerHTML = problem.outputFormat;
        document.getElementById('p-time').textContent = `${problem.timeLimit} 秒`;
        document.getElementById('p-mem').textContent = `${problem.memoryLimit} MB`;
        document.getElementById('p-constraints').innerHTML = hasMeaningfulConstraints(problem.constraints)
          ? problem.constraints
          : '';

        const hint = document.getElementById('p-hint');
        hint.hidden = !hintHtml;
        hint.open = false;
        document.getElementById('p-hint-content').innerHTML = hintHtml;

        // 公開範例與隱藏測資分開；舊題仍相容 sampleInput / sampleOutput。
        const publicSamples = getPublicSamples(problem);
        const fixedOutputNote = publicSamples.length === 1 && problem.testCases?.length === 1 && !publicSamples[0].input
          ? '<p class="sample-note">本題為固定輸出題，只有一組有意義的輸入／輸出範例。</p>'
          : '';
        document.getElementById('p-samples').innerHTML = publicSamples.map((sample, index) => `
          <div class="sample-pair">
            <div class="sample-pair-title">範例 ${index + 1}</div>
            <div class="sample-pair-grid">
              <div class="sample-block">
                <div class="sample-block-header">輸入</div>
                ${renderSampleLines(sample.input, '(無輸入)')}
              </div>
              <div class="sample-block">
                <div class="sample-block-header">輸出</div>
                ${renderSampleLines(sample.output)}
              </div>
            </div>
            ${sample.explanation ? `<p class="sample-note">${escHtml(sample.explanation)}</p>` : ''}
          </div>`).join('') + fixedOutputNote;

        await programmingEditor.setTask({ key: 'pyjudge_code_' + id, starter: STARTER_TEMPLATE });
        editor.refresh();
        // Async content and editor restoration can trigger browser scroll
        // anchoring, so reset once more after the new problem is fully ready.
        requestAnimationFrame(resetProblemScroll);
      } catch (e) {
        document.getElementById('p-desc').innerHTML =
          `<p style="color:var(--danger)">題目載入失敗：${escHtml(e.message)}</p>`;
        currentProblem = null;
        toast('題目載入失敗，請確認 problems/*.json 是否存在');
      } finally {
        loadingProblem = false;
        setSubmitEnabled(true);
      }
    }

    async function resetCode() {
      if (running || loadingProblem || !currentProblem) return;
      if (confirm('確定要重置目前作答方式的草稿嗎？')) {
        const reset = programmingEditor.reset();
        running = true;
        setSubmitEnabled(false);
        try { await reset; clearResultsPanel(); }
        finally { running = false; setSubmitEnabled(true); }
      }
    }

    // ═══════════════════════════════════════════════
    //  HELPERS
    // ═══════════════════════════════════════════════
    function showRunning(v, text) {
      const el = document.getElementById('running-overlay');
      const txt = document.getElementById('running-text');
      if (text) txt.textContent = text;
      el.classList.toggle('show', v);
    }

    let _toastTimer = null;
    function toast(msg, ms = 3000) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 把範例輸入／輸出拆成「每行一列、左側行號」，避免長行自動折行時
    // 被誤認成兩行。每行結尾標一個淡色 ⏎（最後一行不標，因為測資字串
    // 本身結尾沒有換行）。emptyFallback 只用於輸入為空字串時顯示提示文字。
    function renderSampleLines(text, emptyFallback) {
      if (!text && emptyFallback) {
        return `<pre>${escHtml(emptyFallback)}</pre>`;
      }
      const lines = String(text ?? '').split('\n');
      const rows = lines.map((line, i) => {
        const isLast = i === lines.length - 1;
        return `<div class="sample-line"><span class="sample-line-no">${i + 1}</span><span class="sample-line-content">${escHtml(line)}${isLast ? '' : '<span class="sample-line-break" aria-hidden="true">⏎</span>'}</span></div>`;
      }).join('');
      return `<div class="sample-lines">${rows}</div>`;
    }

    // ═══════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      // CodeMirror
      editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
        mode: 'python',
        theme: 'dracula',
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        extraKeys: {
          Tab: cm => {
            if (cm.somethingSelected()) cm.indentSelection('add');
            else cm.replaceSelection('    ');
          },
          'Ctrl-Enter': () => submitCode(),
          'Cmd-Enter': () => submitCode(),
        },
      });
      programmingEditor = new SkillLabEditor({
        mount: document.getElementById('programming-editor'), pythonEditor: editor,
        onLanguageChange: clearResultsPanel
      });
      // Judge 將作答設定放進題目標題列，避免工具列與說明文字占用編輯高度。
      document.getElementById('judge-answer-controls').append(programmingEditor.toolbar);
      // Resize CodeMirror to fill editor-area
      // 注意：初始時 #view-problem 為 display:none，editorArea.offsetHeight = 0
      // 所以這裡只設定 ResizeObserver，不立即呼叫（避免高度為 0 時誤設）
      const editorArea = document.querySelector('.editor-area');
      const resizeEditor = () => {
        const h = editorArea.offsetHeight;
        if (h > 0) {
          editor.setSize('100%', Math.max(260, h - document.getElementById('programming-editor').offsetHeight) + 'px');
          editor.refresh();   // refresh 讓 gutter 重算寬度
        }
      };
      new ResizeObserver(resizeEditor).observe(editorArea);

      const rerenderFromFirstPage = () => { problemListPage = 1; renderProblemList(); };
      document.getElementById('problem-search').addEventListener('input', rerenderFromFirstPage);
      ['stage-filter', 'difficulty-filter', 'tag-filter', 'status-filter'].forEach(id => {
        document.getElementById(id).addEventListener('change', rerenderFromFirstPage);
      });
      document.getElementById('filter-reset').addEventListener('click', () => {
        document.getElementById('problem-filters').reset();
        rerenderFromFirstPage();
        document.getElementById('problem-search').focus();
      });

      // 載入題目清單（problems/index.json）
      fetchManifest()
        .then(manifest => {
          problemManifest = manifest;
          renderProblemList();
        })
        .catch(err => {
          console.warn('Manifest fetch failed, using embedded fallback. This usually happens when opening via file:// protocol.', err);
          // 從 PROBLEMS_DATA 生成列表清單
          problemManifest = Object.values(PROBLEMS_DATA).map(p => ({
            id: p.id,
            title: p.title,
            stage: p.stage,
            audienceLevel: p.audienceLevel,
            apcsLevel: p.apcsLevel,
            difficulty: p.difficulty,
            tags: p.tags
          }));
          renderProblemList();
          toast('目前以檔案模式開啟；建議使用伺服器模式以獲得完整體驗。', 5000);
        });

      document.getElementById('pyodide-status').textContent = 'Python 首次執行時載入';
    });
  </script>
</body>
