<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ThinkLab 程式學習平台，支援 Scratch、Blockly 與 Python。" />
  <title>ThinkLab｜程式學習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f5f7fa;
      --paper: #0c0d12;
      --line: #262a33;
      --muted: #94a3b8;
      --soft: #141720;
      --accent: #3b82f6;
      --accent-hover: #4b7de7;
      --header-height: 60px;
      --mouse-x: 50%;
      --mouse-y: 35%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Plus Jakarta Sans", "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    a,
    button {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #8eb0ff;
      outline-offset: 3px;
    }

    /* 背景科技格線與滑鼠跟隨微光 (Spotlight) */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 85%);
    }

    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        650px circle at var(--mouse-x) var(--mouse-y),
        rgba(59, 130, 246, 0.13),
        transparent 65%
      );
      transition: opacity 0.3s ease;
    }

    .bg-aurora {
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.16), transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* 頂部導覽列 */
    .site-header {
      min-height: var(--header-height);
      padding: 0 clamp(24px, 7vw, 112px);
      display: flex;
      align-items: center;
      gap: 40px;
      color: white;
      border-bottom: 1px solid var(--line);
      background: rgba(12, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
    }

    .brand {
      color: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 4px;
      display: inline-block;
    }

    .header-nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .header-nav a {
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .header-nav a:hover,
    .header-nav a:focus-visible {
      color: white;
    }

    /* 主視覺區域 */
    main {
      width: min(1180px, 100%);
      min-height: calc(100vh - var(--header-height));
      margin: 0 auto;
      padding: clamp(56px, 8vh, 100px) clamp(24px, 5vw, 64px) 70px;
      display: flex;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    .entry {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      align-items: center;
      gap: clamp(56px, 9vw, 120px);
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ONLINE JUDGE 上方前綴小字 */
    .hero-eyebrow {
      font-size: 0.95rem;
      font-weight: 600;
      color: #60a5fa;
      letter-spacing: 0.08em;
      text-transform: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-eyebrow::before {
      content: "";
      width: 16px;
      height: 2px;
      background: #3b82f6;
      display: inline-block;
      border-radius: 2px;
    }

    /* 主標題 */
    .entry h1 {
      max-width: 660px;
      font-size: clamp(3.2rem, 7vw, 6.8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.02em;
    }

    .hero-title-text {
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 75%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .beta-badge {
      flex-shrink: 0;
      padding: 5px 8px;
      border: 1px solid rgba(96, 165, 250, 0.4);
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
      font-family: "Fira Code", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    /* 終端機呼吸游標 */
    .cursor-blinker {
      display: inline-block;
      color: var(--accent);
      font-weight: 400;
      animation: blinker 1s infinite;
      margin-left: 2px;
    }

    @keyframes blinker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 副標說明 */
    .entry-desc {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    /* 支援的編輯器標籤 (純文字等寬風格) */
    .editor-tags {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .editor-tag {
      font-family: "Fira Code", monospace;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      background: rgba(20, 24, 33, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .editor-tag:hover {
      border-color: rgba(96, 165, 250, 0.4);
      color: #ffffff;
      background: rgba(30, 37, 51, 0.85);
      transform: translateY(-1px);
    }

    /* 右側按鈕清單 (保持純文字，注入科技質感) */
    .entry-list {
      width: min(100%, 360px);
      display: grid;
      gap: 12px;
      transform: translateY(24px);
    }

    .entry-button {
      min-height: 58px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(20, 23, 30, 0.6);
      backdrop-filter: blur(8px);
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 6px;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .entry-button::after {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
      transform-origin: right;
      transition: transform 180ms ease;
    }

    /* 第一個按鈕「開始解題」 */
    .entry-list a:first-child {
      border-color: var(--accent);
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
    }

    .entry-list a:first-child:hover,
    .entry-list a:first-child:focus-visible {
      border-color: #60a5fa;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 0 28px rgba(59, 130, 246, 0.55);
      transform: translateX(5px);
    }

    /* 其他可點擊按鈕懸停 */
    a.entry-button:hover,
    a.entry-button:focus-visible {
      color: white;
      border-color: #444f60;
      background: rgba(28, 33, 44, 0.85);
      transform: translateX(5px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    a.entry-button:hover::after,
    a.entry-button:focus-visible::after {
      transform: scaleX(0.55);
    }

    /* 停用按鈕 */
    .entry-button[aria-disabled="true"] {
      color: #626975;
      border-color: #1e2229;
      background: rgba(15, 17, 22, 0.4);
      cursor: not-allowed;
    }

    @media (max-width: 880px) {
      :root {
        --header-height: 68px;
      }

      .site-header {
        padding-inline: 24px;
      }

      main {
        min-height: auto;
        padding: 64px 24px 72px;
      }

      .entry {
        grid-template-columns: 1fr;
        gap: 56px;
      }

      .entry-list {
        width: min(100%, 360px);
        transform: none;
      }
    }

    @media (max-width: 520px) {
      .header-nav {
        gap: 16px;
      }

      .header-nav a:first-child {
        display: none;
      }

      main {
        padding-top: 48px;
      }

      .entry h1 {
        font-size: clamp(2.55rem, 14vw, 4rem);
      }

      .entry-button {
        min-height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- 科技背景：細緻格線 + 滑鼠跟隨微光 (Spotlight) -->
  <div class="bg-canvas">
    <div class="bg-grid"></div>
    <div class="bg-spotlight"></div>
    <div class="bg-aurora"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-icon"></span>
      ThinkLab
    </a>
    <nav class="header-nav" aria-label="主要導覽">
      <a href="beginner.html">LV.1 講義</a>
      <a href="beginner.html?course=intermediate">LV.2 講義</a>
      <a href="beginner.html?course=advanced">LV.3 講義</a>
      <a href="judge.html">題目列表</a>
    </nav>
  </header>

  <main>
    <section class="entry" aria-labelledby="page-title">
      <div class="title-area">
        <div class="hero-eyebrow">ThinkLab's</div>

        <h1 id="page-title">
          <span class="hero-title-text">ONLINE<br>JUDGE</span><span class="cursor-blinker">_</span>
        </h1>

        <p class="entry-desc"><span>零基礎循序掌握運算思維 x 自動驗資系統</span><span class="beta-badge">beta</span></p>

        <div class="editor-tags">
          <span class="editor-tag">Scratch</span>
          <span class="editor-tag">Blockly</span>
          <span class="editor-tag">Python</span>
        </div>
      </div>

      <div class="entry-list" aria-label="學習入口">
        <a class="entry-button" href="judge.html">開始解題</a>
        <a class="entry-button" href="test/index.html">流程圖實驗室</a>
        <a class="entry-button" href="beginner.html">LV.1 講義</a>
        <a class="entry-button" href="beginner.html?course=intermediate">LV.2 講義</a>
        <a class="entry-button" href="beginner.html?course=advanced">LV.3 講義</a>
      </div>
    </section>
  </main>

  <script>
    // 滑鼠跟隨探照燈微光
    window.addEventListener('mousemove', (e) => {
      const x = `${(e.clientX / window.innerWidth) * 100}%`;
      const y = `${(e.clientY / window.innerHeight) * 100}%`;
      document.documentElement.style.setProperty('--mouse-x', x);
      document.documentElement.style.setProperty('--mouse-y', y);
    });
  </script>
</body>

</html>
